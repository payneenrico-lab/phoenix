<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07050f">
<title>Phoenix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* Layout: one upright arcade screen centred in the viewport, an ember glow rising behind it, touch pad below on phones */
  :root {
    color-scheme: dark;
    --void: #07050f;
    --ink: #f4ead8;
    --dim: #8f86a8;
    --flame: #ff7a1a;
    --gold: #ffd23f;
    --plume: #ff4f8b;
    --ice: #7fe9ff;
    --bezel: #24182f;
    --key: #3a2e4d;
    --display: "Press Start 2P", ui-monospace, Consolas, monospace;
    --body: "VT323", ui-monospace, Consolas, monospace;
  }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  body {
    box-sizing: border-box;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 45% at 50% 108%, rgba(255, 122, 26, 0.22), transparent 70%),
      radial-gradient(ellipse 40% 30% at 50% 100%, rgba(255, 79, 139, 0.14), transparent 70%),
      var(--void);
    color: var(--ink);
    font-family: var(--body);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-block: 12px;
    box-sizing: border-box;
  }
  #screen {
    display: block;
    max-width: 100%;
    background: #000;
    border: 2px solid var(--bezel);
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(255, 122, 26, 0.18), 0 0 70px rgba(255, 90, 30, 0.14);
    touch-action: none;
    outline: none;
  }
  #screen:focus-visible { border-color: var(--gold); }
  #legend {
    margin: 0;
    padding-block: 0 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 16px;
    font-size: 19px;
    color: var(--dim);
  }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  kbd {
    font-family: var(--display);
    font-size: 9px;
    color: var(--ink);
    border: 1px solid var(--key);
    border-bottom-width: 2px;
    padding: 3px 5px;
    border-radius: 3px;
    background: #120c1b;
  }
  /* Touch pad, matching the Space Invaders cabinet: move slider left, pause/mute centre, round fire buttons right */
  #pad {
    display: none;
    width: 100%;
    box-sizing: border-box;
    padding-block: 4px 16px;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    pointer-events: none;
  }
  .coarse #pad { display: flex; }
  .coarse #legend { display: none; }
  #pad .grp { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #pad button {
    pointer-events: auto; touch-action: none;
    font: bold 15px/1 "Courier New", monospace; color: #fff;
    background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.45); border-radius: 50%;
    width: 84px; height: 84px; padding: 0;
  }
  #pad button.on { background: rgba(255, 255, 255, 0.4); }
  #pad #fire { width: 104px; height: 104px; border-color: #ff5cf0; color: #ff5cf0; }
  #pad #shield { border-color: var(--ice); color: var(--ice); font-size: 13px; }
  #pad .sm { width: 46px; height: 46px; font-size: 11px; border-radius: 10px; }
  #mid { display: flex; flex-direction: column; gap: 10px; }
  #slide {
    pointer-events: auto; touch-action: none; position: relative;
    flex: 0 1 182px; min-width: 120px; height: 84px; box-sizing: border-box;
    background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.45); border-radius: 42px;
  }
  #slide::before, #slide::after {
    content: ''; position: absolute; top: 50%; transform: translateY(-50%);
    border: 7px solid transparent;
  }
  #slide::before { left: 16px; border-right-color: rgba(255, 255, 255, 0.5); }
  #slide::after { right: 16px; border-left-color: rgba(255, 255, 255, 0.5); }
  #slideThumb {
    position: absolute; top: 2px; left: 2px; width: 76px; height: 76px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.4); pointer-events: none;
  }
  /* Landscape: the screen fills the height, controls sit in the side gutters, pause/mute tucked in the top-right */
  @media (orientation: landscape) {
    .coarse #pad {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0 calc(16px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
    }
    .coarse #mid {
      position: fixed; flex-direction: row;
      top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px));
    }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" tabindex="0" aria-label="Phoenix game screen"></canvas></div>
<p id="legend">
  <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> move</span>
  <span><kbd>SPACE</kbd> fire</span>
  <span><kbd>&darr;</kbd> force field</span>
  <span><kbd>P</kbd> pause</span>
  <span><kbd>M</kbd> sound</span>
</p>
<div id="pad">
  <div id="slide" aria-label="Move ship"><i id="slideThumb"></i></div>
  <div id="mid"><button type="button" id="bp" class="sm">PAUSE</button><button type="button" id="bm" class="sm">MUTE</button></div>
  <div class="grp">
    <button type="button" id="shield" data-k="shield">SHIELD</button>
    <button type="button" id="fire" data-k="fire">FIRE</button>
  </div>
</div>
<script>
(() => {
  'use strict';

  // ---------- screen ----------
  // The playfield is 224 x 288 logical units. The backing store follows the on-screen size x devicePixelRatio,
  // and everything is drawn as vector shapes, so the art stays smooth at any size.
  const W = 224, H = 288;
  const cvs = document.getElementById('screen');
  const ctx = cvs.getContext('2d');
  let K = 3;

  const stage = document.getElementById('stage');
  function fit() {
    const r = stage.getBoundingClientRect();
    const aw = r.width - 4, ah = r.height - 28;
    const sc = Math.max(Math.min(aw / W, ah / H), 0.5);
    const cw = Math.floor(W * sc), ch = Math.floor(H * sc);
    cvs.style.width = cw + 'px';
    cvs.style.height = ch + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const bw = Math.max(W, Math.round(cw * dpr)), bh = Math.round(bw * H / W);
    if (cvs.width !== bw || cvs.height !== bh) { cvs.width = bw; cvs.height = bh; }
    K = cvs.width / W;
  }

  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const coarseUI = coarse || 'ontouchstart' in window;
  if (coarseUI) document.documentElement.classList.add('coarse');
  addEventListener('resize', fit);
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // ---------- helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const mod = (a, n) => ((a % n) + n) % n;
  const pad5 = n => String(n).padStart(5, '0');
  const TAU = Math.PI * 2;

  function txt(s, x, y, c, align = 'left', size = 8) {
    ctx.font = size + "px 'Press Start 2P', ui-monospace, monospace";
    ctx.textAlign = align;
    ctx.textBaseline = 'top';
    ctx.fillStyle = c;
    ctx.fillText(s, x, y);
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function dot(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // Soft additive glows from a cached radial texture per colour
  const glowCache = {};
  function glowTex(c) {
    if (glowCache[c]) return glowCache[c];
    const t = document.createElement('canvas');
    t.width = t.height = 64;
    const g = t.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, hexA(c, 1)); gr.addColorStop(0.25, hexA(c, 0.5));
    gr.addColorStop(0.6, hexA(c, 0.12)); gr.addColorStop(1, hexA(c, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return (glowCache[c] = t);
  }
  function glow(x, y, r, c, a = 1) {
    const pa = ctx.globalAlpha, pc = ctx.globalCompositeOperation;
    ctx.globalAlpha = pa * a;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glowTex(c), x - r, y - r, r * 2, r * 2);
    ctx.globalAlpha = pa;
    ctx.globalCompositeOperation = pc;
  }

  // ---------- art ----------
  const SMALL_PAL = {
    pink:  { w: '#ff4fa3', w2: '#ffd6ec', b: '#ffd23f', fx: ['#ff4fa3', '#ffd23f', '#ffffff'] },
    blue:  { w: '#45b5ff', w2: '#d8f2ff', b: '#ff8a3d', fx: ['#45b5ff', '#ff8a3d', '#ffffff'] },
    green: { w: '#8cff5a', w2: '#e8ffd8', b: '#ff4fa3', fx: ['#8cff5a', '#ff4fa3', '#ffffff'] },
  };
  const BIG_PAL = {
    fire:   { h: '#ff3b4e', b: '#e8344a', bd: '#6e0c1e', y: '#ffd23f', t: '#ff7a1a', w1: '#ff8a1a', w2: '#ffd23f', w3: '#fff0b8' },
    violet: { h: '#3fd0ff', b: '#2a8cff', bd: '#0b2766', y: '#bff3ff', t: '#c04dff', w1: '#b046ff', w2: '#ff6ad5', w3: '#f2d8ff' },
  };
  const BRICK = ['#ffd04a', '#ffbb3c', '#ffa22e', '#ff8a22', '#f2701a', '#dc5a16'];

  // Mothership: 32 x 13 cells of 4px. H hull (armour), C conveyor (moving, breakable), B base (breakable).
  const MS_SPANS = [
    [['H', 11, 20]],
    [['H', 10, 11], ['H', 20, 21]],
    [['H', 9, 11], ['H', 20, 22]],
    [['H', 6, 11], ['H', 20, 25]],
    [['H', 2, 11], ['H', 20, 29]],
    [['H', 0, 11], ['H', 20, 31]],
    [['H', 0, 3], ['C', 4, 27], ['H', 28, 31]],
    [['B', 2, 29]],
    [['B', 2, 29]],
    [['B', 3, 28]],
    [['B', 5, 26]],
    [['B', 8, 23]],
    [['B', 11, 20]],
  ];
  function msGrid() {
    return MS_SPANS.map(spans => {
      const a = Array(32).fill('.');
      for (const [ch, f, t] of spans) for (let i = f; i <= t; i++) a[i] = ch;
      return a;
    });
  }
  const BELT_N = 24, BELT_ROW = 6, BELT_COL = 4;

  // Small-bird formation: a chevron of 15 slots.
  const FORM = [
    [-55, -33, -11, 11, 33, 55],
    [-44, -22, 0, 22, 44],
    [-33, -11, 11, 33],
  ];
  const WAVE_NAMES = ['THE FLOCK', 'THE FLOCK RETURNS', 'PHOENIX EGGS', 'FIREBIRDS', 'THE MOTHERSHIP'];

  // ---------- audio ----------
  let AC = null, master = null, muted = false, noiseBuf = null;
  function audio() {
    try {
      if (!AC) {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        master = AC.createGain();
        master.gain.value = muted ? 0 : 0.42;
        const comp = AC.createDynamicsCompressor();
        master.connect(comp); comp.connect(AC.destination);
        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, f0, f1 = f0, type = 'lowpass', delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; s.loop = true;
    f.type = type;
    f.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.05);
  }
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  function melody(seq, step = 0.14, vol = 0.06) {
    if (!AC || muted) return;
    let t = 0;
    for (const [m, len] of seq) {
      if (m) {
        tone('square', midi(m), midi(m), step * len * 0.92, vol, t);
        tone('triangle', midi(m - 12), midi(m - 12), step * len * 0.92, vol * 0.8, t);
      }
      t += step * len;
    }
  }
  // Beethoven, "Für Elise" (public domain) — the tune Phoenix cabinets played at the start of a game
  const ELISE = [
    [76, 1], [75, 1], [76, 1], [75, 1], [76, 1], [71, 1], [74, 1], [72, 1], [69, 2], [0, 1], [60, 1], [64, 1], [69, 1],
    [71, 2], [0, 1], [64, 1], [68, 1], [71, 1], [72, 2], [0, 1], [64, 1],
    [76, 1], [75, 1], [76, 1], [75, 1], [76, 1], [71, 1], [74, 1], [72, 1], [69, 2], [0, 1], [60, 1], [64, 1], [69, 1],
    [71, 2], [0, 1], [64, 1], [72, 1], [71, 1], [69, 4],
  ];
  const sfx = {
    shoot() { tone('square', 1500, 240, 0.11, 0.06); tone('sawtooth', 3000, 700, 0.05, 0.025); },
    smallDie() { noise(0.2, 0.28, 3200, 700, 'bandpass'); tone('square', 900, 140, 0.16, 0.05); },
    wing() { tone('square', 560, 360, 0.05, 0.05); noise(0.05, 0.1, 5000, 5000, 'highpass'); },
    bigDie() { noise(0.5, 0.4, 2200, 160); tone('triangle', 320, 45, 0.45, 0.16); tone('square', 1200, 300, 0.2, 0.04); },
    chip() { noise(0.04, 0.12, 6000, 6000, 'highpass'); },
    clank() { tone('square', 220, 180, 0.04, 0.03); },
    hatch() { tone('sine', 320, 1300, 0.16, 0.07); tone('sine', 640, 1900, 0.1, 0.04, 0.06); },
    chirp() { tone('sine', 1800, 2900, 0.07, 0.035); tone('sine', 2500, 1600, 0.08, 0.03, 0.08); },
    playerDie() { noise(1.2, 0.55, 2600, 70); tone('sawtooth', 460, 30, 1.1, 0.12); },
    alienDie() {
      noise(2.4, 0.55, 3200, 50);
      tone('sawtooth', 1400, 40, 2.2, 0.09);
      for (let i = 0; i < 8; i++) tone('square', 1100 - i * 110, 900 - i * 100, 0.1, 0.05, i * 0.12);
    },
    extra() { [72, 76, 79, 84].forEach((m, i) => tone('square', midi(m), midi(m), 0.12, 0.06, i * 0.1)); },
    wave() { [64, 67, 71, 76].forEach((m, i) => tone('square', midi(m), midi(m), 0.09, 0.045, i * 0.08)); },
    over() { [69, 65, 62, 57].forEach((m, i) => tone('triangle', midi(m), midi(m), 0.3, 0.1, i * 0.28)); },
    shield() {
      if (!AC || muted) return;
      const t = AC.currentTime;
      const o = AC.createOscillator(), l = AC.createOscillator(), lg = AC.createGain(), g = AC.createGain();
      o.type = 'sawtooth'; o.frequency.value = 150;
      l.frequency.value = 24; lg.gain.value = 70;
      l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.06, t + 0.03);
      g.gain.setValueAtTime(0.06, t + 1.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.25);
      o.connect(g); g.connect(master);
      o.start(t); l.start(t); o.stop(t + 1.3); l.stop(t + 1.3);
    },
  };

  // ---------- input ----------
  const keys = {};
  const touch = { fire: false, shield: false };
  const GAME_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
  addEventListener('keydown', e => {
    audio();
    if (GAME_KEYS.includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    keys[e.code] = true;
    if (e.code === 'Enter' || e.code === 'Space') tryStart();
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    if (e.code === 'KeyM') toggleMute();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; autoPause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });

  document.querySelectorAll('#pad button[data-k]').forEach(btn => {
    const k = btn.dataset.k;
    const on = e => {
      e.preventDefault();
      audio();
      touch[k] = true;
      btn.classList.add('on');
      if (k === 'fire') tryStart();
      if (paused) togglePause();
      try { btn.setPointerCapture(e.pointerId); } catch (err) { /* optional */ }
    };
    const off = () => { touch[k] = false; btn.classList.remove('on'); };
    btn.addEventListener('pointerdown', on);
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, off));
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });
  for (const [id, fn] of [['bp', () => togglePause()], ['bm', () => toggleMute()]]) {
    document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); audio(); fn(); });
  }
  cvs.addEventListener('pointerdown', e => {
    e.preventDefault();
    audio();
    cvs.focus();
    if (paused) togglePause(); else tryStart();
  });

  // Move slider: dragging anywhere across the track sets the ship's x directly and proportionally,
  // so the thumb always sits where the ship is.
  const slide = document.getElementById('slide'), slideThumb = document.getElementById('slideThumb');
  const MIN_X = 10, MAX_X = W - 10;
  let slideX = null;
  const applySlide = e => {
    const r = slide.getBoundingClientRect();
    slideX = MIN_X + clamp((e.clientX - r.left) / r.width, 0, 1) * (MAX_X - MIN_X);
  };
  slide.addEventListener('pointerdown', e => {
    e.preventDefault();
    audio();
    try { slide.setPointerCapture(e.pointerId); } catch (err) { /* optional */ }
    applySlide(e);
  });
  slide.addEventListener('pointermove', e => { if (slideX !== null) applySlide(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => slide.addEventListener(ev, () => { slideX = null; }));
  slide.addEventListener('contextmenu', e => e.preventDefault());
  function syncSlideThumb() {
    const travel = slide.clientWidth - 4 - slideThumb.offsetWidth;
    const x = player && mode !== 'attract' ? player.x : W / 2;
    slideThumb.style.left = (2 + (x - MIN_X) / (MAX_X - MIN_X) * travel) + 'px';
  }
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  function input() {
    return {
      left: keys.ArrowLeft || keys.KeyA,
      right: keys.ArrowRight || keys.KeyD,
      fire: keys.Space || keys.KeyZ || keys.KeyX || keys.ArrowUp || keys.KeyW || touch.fire,
      shield: keys.ArrowDown || keys.KeyS || keys.ShiftLeft || keys.ShiftRight || touch.shield,
    };
  }

  // ---------- state ----------
  let hi = 0;
  try { hi = parseInt(localStorage.getItem('phoenix-hi'), 10) || 0; } catch (e) { /* storage unavailable */ }
  function saveHi() { try { localStorage.setItem('phoenix-hi', String(hi)); } catch (e) { /* ignore */ } }

  let mode = 'attract';        // attract | play | over
  let paused = false;
  let frame = 0, overT = 0;
  let score = 0, lives = 3, wave = 0, cycle = 0, nextBonus = 5000;
  let phase = 'intro', phaseT = 0; // intro | fight | clear
  let player = null, pshot = null, ebul = [], birds = [], ms = null, parts = [], floats = [], rings = [];
  let shake = 0, flash = 0;
  const SHIELD_T = 75, SHIELD_CD = 300;

  const stars = [];
  for (let i = 0; i < 80; i++) {
    const r = rand(0.3, 1.1);
    stars.push({ x: Math.random() * W, y: Math.random() * H, r, sp: 0.06 + r * 0.3, tw: rand(0.5, 1.5),
      c: pick(['#ffffff', '#ffffff', '#ffd23f', '#7fe9ff', '#ff8ad8', '#8f86a8']), ph: (Math.random() * 120) | 0 });
  }

  function tryStart() {
    if (mode === 'attract' || (mode === 'over' && overT > 60)) startGame();
  }
  function togglePause() {
    if (mode !== 'play') return;
    paused = !paused;
  }
  function autoPause() { if (mode === 'play') paused = true; }
  function toggleMute() {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.42;
  }

  function startGame() {
    audio();
    mode = 'play'; paused = false;
    score = 0; lives = 3; wave = 0; cycle = 0; nextBonus = 5000;
    parts = []; floats = []; rings = [];
    player = { x: W / 2, y: 252, alive: true, inv: 0, shieldT: 0, shieldCD: 0, respawnT: 0 };
    startWave();
    melody(ELISE);
  }

  function startWave() {
    ebul = []; pshot = null; birds = []; ms = null;
    phase = 'intro'; phaseT = 0;
    if (wave <= 1) spawnSmall();
    else if (wave <= 3) spawnBig();
    else spawnMother();
    if (!(wave === 0 && cycle === 0)) sfx.wave();
  }

  function spawnSmall() {
    const pal = wave === 0 ? 'pink' : 'blue';
    let i = 0;
    FORM.forEach((row, ri) => row.forEach(ox => {
      const fromLeft = i % 2 === 0;
      birds.push({ kind: 'small', pal, ox, oy: ri * 16, x: fromLeft ? -16 : W + 16, y: 30 + (i * 13) % 70,
        vx: 0, vy: 0, state: 'return', delay: 10 + i * 7, ph: Math.random() * 6.28, t: 0, anim: (Math.random() * 20) | 0, escort: false });
      i++;
    }));
  }

  function spawnBig() {
    const pal = wave === 2 ? 'fire' : 'violet';
    for (let i = 0; i < 8; i++) {
      birds.push({ kind: 'big', pal, x: 24 + i * 25, y: -10, hy: 52 + (i % 3) * 22, state: 'egg', t2: 0, delay: i * 10,
        wings: [[0, 0, 0], [0, 0, 0]], growing: true, regen: 0, flap: Math.random() * 6, flapRate: 0.12 + (wave === 3 ? 0.03 : 0) + Math.random() * 0.02,
        vx: 0, vy: 0, tx: 0, ty: 0, retarget: 0 });
    }
  }

  function spawnMother() {
    ms = { x: W / 2, y: -56, top: 26, grid: msGrid(), belt: Array(BELT_N).fill(1), off: 0, t: 0,
      alive: true, dead: 0, fireT: 90, escortT: 160 };
  }

  function addScore(n) {
    score += n;
    if (score > hi) hi = score;
    if (score >= nextBonus) {
      lives++;
      nextBonus = nextBonus < 30000 ? 30000 : nextBonus + 30000;
      sfx.extra();
      floats.push({ x: W / 2, y: 236, t: 'EXTRA SHIP', life: 100, c: '#8cff5a' });
    }
  }

  function burst(x, y, cols, n = 14, sp = 1.6, life = 30) {
    if (parts.length > 700) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = Math.random() * sp + 0.25;
      const l = life * (0.5 + Math.random() * 0.5);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: l, max: l, c: cols[i % cols.length], s: Math.random() < 0.3 ? 2 : 1 });
    }
    if (n >= 16) rings.push({ x, y, r: 1, vr: sp * 0.9, life: 20, max: 20, c: cols[0] });
  }

  // ---------- player ----------
  function killPlayer() {
    if (!player.alive || player.inv > 0 || player.shieldT > 0) return;
    player.alive = false;
    player.respawnT = 150;
    lives--;
    pshot = null;
    burst(player.x, player.y, ['#ffffff', '#9fe7ff', '#ffe65a', '#ff4a3a'], 40, 2.4, 55);
    burst(player.x, player.y, ['#ff7a1a', '#ffd23f'], 20, 1.0, 70);
    shake = 22;
    sfx.playerDie();
  }

  function updatePlayer() {
    const p = player;
    if (!p.alive) {
      if (--p.respawnT <= 0) {
        if (lives > 0) {
          p.alive = true; p.x = W / 2; p.inv = 120; p.shieldT = 0; p.shieldCD = 0;
          ebul = [];
          for (const b of birds) {
            if (b.kind === 'small' && b.state === 'dive' && !b.escort) b.state = 'return';
            if (b.kind === 'big' && b.state === 'swoop') { b.state = 'fly'; b.ty = rand(44, 110); }
          }
        } else {
          mode = 'over'; overT = 0;
          saveHi();
          sfx.over();
        }
      }
      return;
    }
    if (p.inv > 0) p.inv--;
    if (p.shieldT > 0) {
      if (--p.shieldT === 0) p.shieldCD = SHIELD_CD;
    } else if (p.shieldCD > 0) p.shieldCD--;

    const inp = input();
    if (p.shieldT === 0) {
      if (inp.left) p.x -= 1.5;
      if (inp.right) p.x += 1.5;
      if (slideX !== null) p.x = slideX;
      p.x = clamp(p.x, MIN_X, MAX_X);
      if (inp.shield && p.shieldCD === 0) {
        p.shieldT = SHIELD_T;
        sfx.shield();
      } else if (inp.fire && !pshot) {
        pshot = { x: p.x, y: p.y - 8 };
        sfx.shoot();
      }
    }
  }

  function updateShot() {
    if (!pshot) return;
    for (let s = 0; s < 3; s++) {
      pshot.y -= 2;
      if (pshot.y < 24) { pshot = null; return; }
      if (shotHits(pshot.x, pshot.y)) { pshot = null; return; }
    }
  }

  // ---------- birds ----------
  function segRect(b, s, k, A) {
    const sign = s === 0 ? -1 : 1;
    const cx = b.x + sign * (6 + k * 4);
    const x = sign > 0 ? cx - 1.5 : cx - 2.5;
    const y = b.y - 3 - A * (k + 1) * 1.8;
    return { x, y, h: k === 2 ? 4 : 5 };
  }

  function birdPoints(b) {
    if (b.kind === 'small') {
      if (b.escort || b.state !== 'form') return 80;
      return wave === 0 ? 20 : 40;
    }
    if (b.state === 'swoop' || b.y > 150) return pick([100, 200, 200, 400, 400, 800]);
    return wave === 2 ? 50 : 100;
  }

  function killBird(b, scored) {
    if (b.dead) return;
    b.dead = true;
    if (b.kind === 'small') {
      burst(b.x, b.y, SMALL_PAL[b.pal].fx, 16, 1.5, 28);
      sfx.smallDie();
    } else {
      const P = BIG_PAL[b.pal];
      burst(b.x, b.y, [P.w1, P.w2, P.b, P.y, '#ffffff'], 34, 2.2, 44);
      shake = Math.max(shake, 6);
      sfx.bigDie();
    }
    if (scored) {
      const pts = birdPoints(b);
      addScore(pts);
      if (pts >= 80) floats.push({ x: b.x, y: b.y - 4, t: String(pts), life: 60, c: pts >= 400 ? '#ffd23f' : '#ffffff' });
    }
  }

  function startDive(b) {
    b.state = 'dive';
    b.vy = -1.4;
    b.vx = (b.x < W / 2 ? -1 : 1) * rand(0.6, 1.4);
    b.maxVy = 2.0 + 0.25 * cycle + (wave === 1 ? 0.4 : 0);
    b.maxVx = 2.2 + 0.2 * cycle;
    b.agg = 1 + cycle * 0.2 + (wave === 1 ? 0.3 : 0);
    b.pullY = Math.random() < 0.45 ? rand(160, 215) : 999;
    if (Math.random() < 0.6) sfx.chirp();
  }

  function updateSmall(b, fx, fy) {
    b.anim++;
    if (b.state === 'return') {
      if (b.delay > 0) { b.delay--; return; }
      const tx = fx + b.ox, ty = fy + b.oy;
      const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy) || 1;
      const sp = 2.4;
      b.vx += (dx / d * sp - b.vx) * 0.08;
      b.vy += (dy / d * sp - b.vy) * 0.08;
      b.x += b.vx; b.y += b.vy;
      if (d < 4) b.state = 'form';
    } else if (b.state === 'form') {
      const tx = fx + b.ox + Math.sin(b.t * 0.08 + b.ph) * 2.5;
      const ty = fy + b.oy + Math.cos(b.t * 0.11 + b.ph) * 2;
      b.x += (tx - b.x) * 0.2; b.y += (ty - b.y) * 0.2;
    } else {
      const tx = player && player.alive ? player.x : W / 2;
      b.vx += Math.sign(tx - b.x) * 0.05 * b.agg + (Math.random() - 0.5) * 0.22;
      if (Math.random() < 0.015) b.vx *= -0.7;
      b.vx = clamp(b.vx, -b.maxVx, b.maxVx);
      b.vy = Math.min(b.vy + 0.045, b.maxVy);
      b.x += b.vx; b.y += b.vy;
      if (b.x < 8) { b.x = 8; b.vx = Math.abs(b.vx); }
      if (b.x > W - 8) { b.x = W - 8; b.vx = -Math.abs(b.vx); }
      if (!b.escort && b.y > b.pullY) b.state = 'return';
      if (b.y > H + 10) {
        b.y = -10; b.x = rand(20, W - 20);
        if (b.escort) b.vy = 1;
        else { b.state = 'return'; b.vx = 0; b.vy = 1.5; }
      }
    }
  }

  function updateBig(b, fight, swoopers) {
    if (b.state === 'egg') {
      if (b.delay > 0) { b.delay--; return; }
      b.t2++;
      b.y += (b.hy - b.y) * 0.05;
      if (b.t2 > 100) {
        b.state = 'fly';
        b.tx = b.x; b.ty = b.y; b.retarget = 40;
        burst(b.x, b.y, ['#ff7a1a', '#ffe680', '#ffffff'], 12, 1.2, 22);
        sfx.hatch();
      }
      return;
    }
    b.flap += b.flapRate;
    if (++b.regen >= (b.growing ? 7 : Math.max(70, 150 - cycle * 20))) {
      b.regen = 0;
      let restored = false;
      for (let k = 0; k < 3 && !restored; k++) for (let s = 0; s < 2 && !restored; s++) {
        if (!b.wings[s][k]) { b.wings[s][k] = 1; restored = true; }
      }
      if (!restored) b.growing = false;
    }
    if (--b.retarget <= 0 || (Math.abs(b.tx - b.x) < 6 && Math.abs(b.ty - b.y) < 6)) {
      if (b.state === 'swoop') b.state = 'fly';
      b.tx = rand(24, W - 24); b.ty = rand(44, 140); b.retarget = rand(80, 200) | 0;
    }
    if (b.state === 'swoop') {
      if (player.alive) b.tx += (player.x - b.tx) * 0.02;
      if (b.y > 218) { b.state = 'fly'; b.ty = rand(44, 110); b.tx = rand(24, W - 24); b.retarget = 200; }
    }
    const swoop = b.state === 'swoop';
    const acc = swoop ? 0.07 : 0.03;
    const maxV = swoop ? 2.3 + cycle * 0.2 : 1.0 + cycle * 0.15 + (wave === 3 ? 0.3 : 0);
    b.vx += clamp((b.tx - b.x) * 0.005, -acc, acc);
    b.vy += clamp((b.ty - b.y) * 0.005, -acc, acc);
    b.vx *= 0.985; b.vy *= 0.985;
    const v = Math.hypot(b.vx, b.vy);
    if (v > maxV) { b.vx *= maxV / v; b.vy *= maxV / v; }
    b.x += b.vx;
    b.y += b.vy + Math.cos(b.flap) * 0.3;
    b.x = clamp(b.x, 18, W - 18);
    b.y = Math.max(b.y, 36);
    const maxSwoop = (wave === 3 ? 2 : 1) + Math.min(cycle, 2);
    if (fight && player.alive && b.state === 'fly' && swoopers < maxSwoop &&
        Math.random() < 0.0018 * (1 + cycle * 0.4) * (wave === 3 ? 1.5 : 1)) {
      b.state = 'swoop'; b.tx = player.x; b.ty = 232; b.retarget = 240;
    }
  }

  function enemyFire(x, y, aimed) {
    const maxEB = 3 + Math.min(cycle, 3) + (wave >= 2 ? 1 : 0);
    if (ebul.length >= maxEB) return;
    const vx = aimed && player.alive ? clamp((player.x - x) * 0.01, -0.6, 0.6) : 0;
    ebul.push({ x, y, vx, vy: 2.0 + 0.25 * Math.min(cycle, 4) + Math.random() * 0.5 });
  }

  function updateBirds() {
    const fight = phase === 'fight' && mode === 'play';
    const fx = W / 2 + Math.sin(frame * 0.012) * 28;
    const fy = 56 + Math.sin(frame * 0.031) * 5;
    let divers = 0, swoopers = 0, alive = 0;
    for (const b of birds) {
      if (b.kind === 'small') { alive++; if (b.state === 'dive' && !b.escort) divers++; }
      else if (b.state === 'swoop') swoopers++;
    }
    const canShoot = fight && player.alive;
    const maxDivers = 2 + wave + Math.min(cycle, 3);
    for (const b of birds) {
      if (b.dead) continue;
      b.t = (b.t || 0) + 1;
      if (b.kind === 'small') {
        if (fight && player.alive && b.state === 'form' && divers < maxDivers &&
            Math.random() < 0.0025 * (1 + cycle * 0.4) * (1 + (15 - alive) * 0.12)) {
          startDive(b); divers++;
        }
        updateSmall(b, fx, fy);
        if (canShoot && b.delay <= 0 && b.y > 30 && b.y < 230) {
          const chance = b.state === 'form' ? 0.0018 * (1 + cycle * 0.3) * (wave === 1 ? 1.4 : 1) : 0.02;
          if (Math.random() < chance) enemyFire(b.x, b.y + 5, b.state !== 'form');
        }
      } else {
        updateBig(b, fight, swoopers);
        if (canShoot && b.state !== 'egg') {
          const chance = b.state === 'swoop' ? 0.025 : 0.004 * (1 + cycle * 0.3);
          if (Math.random() < chance) enemyFire(b.x, b.y + 6, b.state === 'swoop');
        }
      }
      birdVsPlayer(b);
    }
    birds = birds.filter(b => !b.dead);
  }

  function birdVsPlayer(b) {
    if (b.dead || !player || !player.alive) return;
    if (b.kind === 'big' && b.state === 'egg') return;
    if (b.kind === 'small' && b.delay > 0) return;
    const dx = Math.abs(b.x - player.x), dy = Math.abs(b.y - player.y);
    if (player.shieldT > 0) {
      if (Math.hypot(dx, dy) < (b.kind === 'big' ? 20 : 16)) killBird(b, true);
      return;
    }
    if (player.inv > 0) return;
    if (b.kind === 'small' ? (dx < 9 && dy < 7) : (dx < 12 && dy < 8)) {
      killBird(b, false);
      killPlayer();
    }
  }

  function shotHits(px, py) {
    for (const b of birds) {
      if (b.dead) continue;
      if (b.kind === 'small') {
        if (b.delay > 0) continue;
        if (Math.abs(px - b.x) <= 6 && py >= b.y - 4 && py <= b.y + 4) { killBird(b, true); return true; }
      } else if (b.state !== 'egg') {
        if (Math.abs(px - b.x) <= 4 && py >= b.y - 6 && py <= b.y + 5) { killBird(b, true); return true; }
        const A = Math.sin(b.flap);
        for (let s = 0; s < 2; s++) for (let k = 0; k < 3; k++) {
          if (!b.wings[s][k]) continue;
          const r = segRect(b, s, k, A);
          if (px >= r.x && px < r.x + 4 && py >= r.y && py < r.y + r.h + 1) {
            b.wings[s][k] = 0;
            const P = BIG_PAL[b.pal];
            burst(px, py, [P.w1, P.w2], 6, 0.9, 16);
            sfx.wing();
            return true;
          }
        }
      }
    }
    return hitMS(px, py);
  }

  // ---------- mothership ----------
  function hitMS(px, py) {
    if (!ms || ms.y < -40) return false;
    const L = ms.x - 64, T = ms.y;
    const c = Math.floor((px - L) / 4), r = Math.floor((py - T) / 4);
    if (c < 0 || c >= 32 || r < 0 || r >= ms.grid.length) return false;
    if (r >= 1 && r <= 5 && c >= 12 && c <= 19) {
      if (ms.alive) { killAlien(); return true; }
      return false;
    }
    if (r === BELT_ROW && c >= BELT_COL && c < BELT_COL + BELT_N) {
      const i = mod(c - BELT_COL - ms.off, BELT_N);
      if (ms.belt[i]) {
        ms.belt[i] = 0;
        burst(px, py, ['#c06bff', '#ffffff'], 5, 0.8, 14);
        sfx.chip();
        return true;
      }
      return false;
    }
    const ch = ms.grid[r][c];
    if (ch === 'H') { burst(px, py, ['#9fb0ff'], 3, 0.6, 10); sfx.clank(); return true; }
    if (ch === 'B') {
      ms.grid[r][c] = '.';
      burst(px, py, ['#ff8a1a', '#ffd23f'], 5, 0.8, 14);
      sfx.chip();
      return true;
    }
    return false;
  }

  function killAlien() {
    ms.alive = false; ms.dead = 0;
    const sec = ms.t / 60;
    const pts = clamp(9000 - Math.floor(sec / 8) * 1000, 1000, 9000);
    addScore(pts);
    floats.push({ x: ms.x, y: ms.y + 30, t: String(pts), life: 150, c: '#ffd23f' });
    sfx.alienDie();
    flash = 36; shake = 34;
    ebul = [];
    for (const b of birds) killBird(b, false);
  }

  function updateMS() {
    if (!ms) return;
    ms.t++;
    const L = ms.x - 64, T = ms.y;
    if (ms.alive) {
      if (ms.y < ms.top) ms.y = Math.min(ms.top, ms.y + 0.6);
      else if (phase === 'fight' && ms.t % Math.max(14, 30 - cycle * 4) === 0 && ms.y < 140) ms.y += 1;
      if (ms.t % 6 === 0) ms.off = (ms.off + 1) % BELT_N;
      if (phase === 'fight' && mode === 'play' && player.alive) {
        if (--ms.fireT <= 0) {
          ms.fireT = Math.max(16, 52 - cycle * 6 - (ms.y - ms.top) / 5) + rand(0, 22);
          if (Math.random() < 0.25) {
            const side = Math.random() < 0.5 ? 0 : 31;
            enemyFire(L + side * 4 + 2, T + 28, true);
          } else {
            const c = 2 + ((Math.random() * 28) | 0);
            for (let r = ms.grid.length - 1; r >= 7; r--) {
              if (ms.grid[r][c] === 'B') { enemyFire(L + c * 4 + 2, T + (r + 1) * 4, false); break; }
            }
          }
        }
        const escorts = birds.filter(b => b.escort).length;
        if (--ms.escortT <= 0) {
          ms.escortT = rand(150, 300) | 0;
          if (escorts < 2 + Math.min(cycle, 2)) {
            birds.push({ kind: 'small', pal: 'green', ox: 0, oy: 0, x: rand(20, W - 20), y: -10, vx: rand(-1, 1), vy: 1,
              state: 'dive', delay: 0, ph: 0, t: 0, anim: 0, escort: true,
              maxVy: 1.8 + 0.2 * cycle, maxVx: 2.2, agg: 1 + cycle * 0.2, pullY: 999 });
            sfx.chirp();
          }
        }
      }
    } else {
      ms.dead++;
      for (let n = 0; n < 3; n++) {
        const r = (Math.random() * ms.grid.length) | 0, c = (Math.random() * 32) | 0;
        if (ms.grid[r][c] !== '.') {
          const col = ms.grid[r][c] === 'B' ? ['#ff8a1a', '#ffd23f'] : ms.grid[r][c] === 'C' ? ['#c06bff', '#ffffff'] : ['#7d8cff', '#ffffff'];
          ms.grid[r][c] = '.';
          if (r === BELT_ROW) ms.belt.fill(0);
          burst(L + c * 4 + 2, T + r * 4 + 2, col, 4, 1.4, 30);
        }
      }
      if (ms.dead % 20 === 0) { noise(0.3, 0.25, 1800, 120); shake = Math.max(shake, 8); }
      if (ms.dead >= 170) { ms = null; phase = 'clear'; phaseT = 0; }
    }
  }

  // ---------- update ----------
  function update() {
    frame++;
    for (const s of stars) { s.y += s.sp; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
    if (mode === 'attract') return;
    if (mode === 'over') overT++;
    if (mode === 'over' && overT > 600) { mode = 'attract'; birds = []; ms = null; ebul = []; }

    if (mode === 'play') {
      phaseT++;
      if (phase === 'intro' && phaseT >= (wave === 0 && cycle === 0 ? 200 : 130)) { phase = 'fight'; phaseT = 0; }
      if (phase === 'fight' && wave < 4 && birds.length === 0) { phase = 'clear'; phaseT = 0; }
      if (phase === 'clear' && phaseT >= 110) {
        wave++;
        if (wave > 4) { wave = 0; cycle++; }
        startWave();
      }
      updatePlayer();
      updateShot();
    }
    updateBirds();
    updateMS();

    for (const b of ebul) {
      b.x += b.vx; b.y += b.vy;
      if (b.y > H) { b.dead = true; continue; }
      if (mode !== 'play' || !player.alive) continue;
      if (player.shieldT > 0) {
        if (Math.hypot(b.x - player.x, b.y - player.y + 2) < 15) { b.dead = true; burst(b.x, b.y, ['#7fe9ff', '#ffffff'], 4, 0.8, 12); }
      } else if (player.inv <= 0 && Math.abs(b.x - player.x) <= 6 && b.y + 4 >= player.y - 4 && b.y <= player.y + 6) {
        b.dead = true;
        killPlayer();
      }
    }
    ebul = ebul.filter(b => !b.dead);

    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; p.life--; }
    parts = parts.filter(p => p.life > 0);
    for (const r of rings) { r.r += r.vr; r.vr *= 0.94; r.life--; }
    rings = rings.filter(r => r.life > 0);
    for (const f of floats) { f.y -= 0.3; f.life--; }
    floats = floats.filter(f => f.life > 0);
    if (shake > 0) shake--;
    if (flash > 0) flash--;
  }

  // ---------- render ----------
  let skyGrad = null;
  function drawBackdrop() {
    if (!skyGrad) {
      skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#04030b'); skyGrad.addColorStop(0.55, '#090616'); skyGrad.addColorStop(1, '#16091d');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
    glow(36, 96, 96, '#2c1458', 0.45);
    glow(196, 214, 120, '#4a1228', 0.35);
    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin((frame + s.ph) * 0.05 * s.tw);
      ctx.globalAlpha = tw;
      ctx.fillStyle = s.c;
      dot(s.x, s.y, s.r);
      if (s.r > 0.75) glow(s.x, s.y, s.r * 4.5, s.c, 0.3 * tw);
    }
    ctx.globalAlpha = 1;
  }

  function drawShip(x, y, s = 1, flame = true) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    if (flame) {
      const fl = 2.2 + Math.sin(frame * 0.8) * 0.6 + Math.random() * 0.8;
      glow(0, 6.5, 7, '#ff6a2a', 0.5);
      const fg = ctx.createLinearGradient(0, 4.6, 0, 5 + fl * 1.8);
      fg.addColorStop(0, '#fff6c0'); fg.addColorStop(0.4, '#ffb030'); fg.addColorStop(1, 'rgba(255,60,30,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.moveTo(-1.5, 4.6); ctx.quadraticCurveTo(0, 5 + fl * 2, 1.5, 4.6); ctx.closePath(); ctx.fill();
    }
    // wingtip cannons
    ctx.fillStyle = '#ff4a3a';
    rrect(-7.7, 1, 1, 4.6, 0.4); ctx.fill();
    rrect(6.7, 1, 1, 4.6, 0.4); ctx.fill();
    // hull
    const hg = ctx.createLinearGradient(-7.5, 0, 7.5, 0);
    hg.addColorStop(0, '#2a6aa8'); hg.addColorStop(0.33, '#9fe7ff'); hg.addColorStop(0.5, '#f4fdff');
    hg.addColorStop(0.67, '#9fe7ff'); hg.addColorStop(1, '#2a6aa8');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(0, -6.4);
    ctx.lineTo(1.3, -2.4); ctx.lineTo(2.4, 0.2); ctx.lineTo(7, 3.4); ctx.lineTo(7, 5.4); ctx.lineTo(2.6, 4.4); ctx.lineTo(1.4, 5.3);
    ctx.lineTo(-1.4, 5.3); ctx.lineTo(-2.6, 4.4); ctx.lineTo(-7, 5.4); ctx.lineTo(-7, 3.4); ctx.lineTo(-2.4, 0.2); ctx.lineTo(-1.3, -2.4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(225, 250, 255, 0.75)'; ctx.lineWidth = 0.3; ctx.lineJoin = 'round'; ctx.stroke();
    // wing stripes
    ctx.strokeStyle = '#ff4a3a'; ctx.lineWidth = 0.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(3.3, 2.4); ctx.lineTo(6.1, 4.3); ctx.moveTo(-3.3, 2.4); ctx.lineTo(-6.1, 4.3); ctx.stroke();
    // canopy
    const cg = ctx.createRadialGradient(-0.3, -0.5, 0.1, 0, 0.3, 2.2);
    cg.addColorStop(0, '#fffbe0'); cg.addColorStop(0.5, '#ffd23f'); cg.addColorStop(1, '#b85c00');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.ellipse(0, 0.4, 1.05, 2.1, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawSmallBird(x, y, pal, phase, s = 1, rot = 0) {
    const P = SMALL_PAL[pal];
    const a = Math.sin(phase); // +1 = wings raised
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    glow(0, 0, 9, P.w, 0.22);
    const wg = ctx.createLinearGradient(0, 0, 7, 0);
    wg.addColorStop(0, P.b); wg.addColorStop(0.3, P.w); wg.addColorStop(1, P.w2);
    ctx.fillStyle = wg;
    for (const side of [1, -1]) {
      ctx.save(); ctx.scale(side, 1);
      ctx.beginPath();
      ctx.moveTo(0.9, -1.2);
      ctx.quadraticCurveTo(3.6, -2 - a * 2.6, 6.8, -0.8 - a * 3.6);
      ctx.quadraticCurveTo(5.4, 0.1 - a * 1.9, 4.7, 0.4 - a * 1.3);
      ctx.quadraticCurveTo(4, 1.3 - a * 0.9, 3.2, 0.9 - a * 0.6);
      ctx.quadraticCurveTo(2.2, 1.8 - a * 0.3, 0.9, 1.4);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = P.w; ctx.lineWidth = 0.55; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 2); ctx.lineTo(-1, 4.3);
    ctx.moveTo(0, 2); ctx.lineTo(0, 4.8);
    ctx.moveTo(0, 2); ctx.lineTo(1, 4.3);
    ctx.stroke();
    const bg = ctx.createRadialGradient(-0.4, -0.5, 0.2, 0, 0.4, 2.6);
    bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.4, P.b); bg.addColorStop(1, hexA(P.b, 0.8));
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0.4, 1.5, 2.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = P.b; dot(0, -1.8, 1.3);
    ctx.fillStyle = '#ffffff'; dot(-0.55, -2, 0.42); dot(0.55, -2, 0.42);
    ctx.fillStyle = '#1a0a20'; dot(-0.5, -1.9, 0.2); dot(0.6, -1.9, 0.2);
    ctx.restore();
  }

  // One breakable wing segment: a swept feather block whose ragged trailing edge hangs below the hit box
  function drawFeather(r, k, side, P) {
    const y0 = r.y, h = r.h;
    const xi = side > 0 ? r.x - 0.7 : r.x + 4.7;   // edge nearest the body
    const xo = side > 0 ? r.x + 4.7 : r.x - 0.7;   // edge towards the wingtip
    const g = ctx.createLinearGradient(0, y0 - 0.5, 0, y0 + h + 1.5);
    g.addColorStop(0, P.w3); g.addColorStop(0.4, P.w1); g.addColorStop(1, P.w2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(xi, y0 + 0.5);
    if (k === 2) {
      ctx.quadraticCurveTo((xi + xo) / 2, y0 - 0.9, xo + side * 0.9, y0 - 0.6);
      ctx.quadraticCurveTo(xo + side * 0.4, y0 + 1.2, xo - side * 0.2, y0 + h - 0.6);
    } else {
      ctx.quadraticCurveTo((xi + xo) / 2, y0 - 0.6, xo, y0 + 0.2);
      ctx.lineTo(xo, y0 + h - 1.4);
    }
    // ragged trailing edge: three feather points, longest towards the tip
    for (let i = 0; i < 3; i++) {
      const fa = xo + (xi - xo) * (i / 3), fb = xo + (xi - xo) * ((i + 1) / 3);
      ctx.lineTo(fa + (fb - fa) * 0.35, y0 + h + 0.9 + k * 0.35 - i * 0.35);
      ctx.lineTo(fb, y0 + h - 1.1);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = hexA(P.w2, 0.5); ctx.lineWidth = 0.25; ctx.lineJoin = 'round';
    ctx.stroke();
    // feather shafts
    ctx.strokeStyle = hexA(P.w3, 0.5); ctx.lineWidth = 0.25;
    ctx.beginPath();
    for (let i = 1; i < 3; i++) {
      const fx = xo + (xi - xo) * (i / 3);
      ctx.moveTo(fx, y0 + 1); ctx.lineTo(fx - side * 0.3, y0 + h - 0.8);
    }
    ctx.stroke();
  }

  function drawBigBird(b, x, y) {
    const P = BIG_PAL[b.pal];
    const A = Math.sin(b.flap);
    const pos = { x, y };
    glow(x, y, 22, P.w1, 0.26);
    // tail plumes
    const sw = Math.cos(b.flap) * 1.2;
    ctx.strokeStyle = P.t; ctx.lineWidth = 0.9; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y + 3); ctx.quadraticCurveTo(x - 1.5, y + 6, x - 3.5 + sw, y + 9);
    ctx.moveTo(x, y + 3); ctx.quadraticCurveTo(x, y + 6.5, x + sw * 0.6, y + 10);
    ctx.moveTo(x, y + 3); ctx.quadraticCurveTo(x + 1.5, y + 6, x + 3.5 + sw, y + 9);
    ctx.stroke();
    glow(x + sw * 0.6, y + 10, 2.6, P.y, 0.8);
    glow(x - 3.5 + sw, y + 9, 2, P.t, 0.7);
    glow(x + 3.5 + sw, y + 9, 2, P.t, 0.7);
    // wings, one feather block per breakable segment
    for (let s = 0; s < 2; s++) for (let k = 0; k < 3; k++) {
      if (b.wings[s][k]) drawFeather(segRect(pos, s, k, A), k, s === 0 ? -1 : 1, P);
    }
    // leading edge of each wing, running out through the segments still attached
    ctx.strokeStyle = P.w3; ctx.lineWidth = 0.7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let s = 0; s < 2; s++) {
      if (!b.wings[s][0]) continue;
      const side = s === 0 ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(x + side * 2.6, y - 1.4);
      for (let k = 0; k < 3 && b.wings[s][k]; k++) {
        const r = segRect(pos, s, k, A);
        ctx.lineTo(r.x + 2 + side * (k === 2 ? 3.1 : 2.6), r.y + (k === 2 ? -0.5 : 0.1));
      }
      ctx.stroke();
    }
    // body
    const bg = ctx.createRadialGradient(x - 1, y - 0.5, 0.3, x, y + 0.5, 4.2);
    bg.addColorStop(0, P.y); bg.addColorStop(0.35, P.b); bg.addColorStop(1, P.bd);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(x, y + 0.6, 3.3, 3.9, 0, 0, TAU); ctx.fill();
    // crest, head, eyes, beak
    ctx.fillStyle = P.y;
    ctx.beginPath();
    ctx.moveTo(x - 1.6, y - 5); ctx.lineTo(x - 2.3, y - 7.6); ctx.lineTo(x - 0.6, y - 5.7); ctx.lineTo(x, y - 8.5);
    ctx.lineTo(x + 0.6, y - 5.7); ctx.lineTo(x + 2.3, y - 7.6); ctx.lineTo(x + 1.6, y - 5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.h; dot(x, y - 3.8, 2.3);
    ctx.fillStyle = '#ffffff'; dot(x - 0.95, y - 4.1, 0.6); dot(x + 0.95, y - 4.1, 0.6);
    ctx.fillStyle = '#16061c'; dot(x - 0.85, y - 4, 0.3); dot(x + 0.85, y - 4, 0.3);
    ctx.fillStyle = P.y;
    ctx.beginPath(); ctx.moveTo(x - 0.7, y - 2.7); ctx.lineTo(x + 0.7, y - 2.7); ctx.lineTo(x, y - 1.3); ctx.closePath(); ctx.fill();
  }

  function drawEgg(b) {
    if (b.delay > 0) return;
    const rock = b.t2 > 70 ? Math.sin(frame * 0.9) * 0.25 : 0;
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(rock);
    glow(0, 0, 11, '#ff7a1a', 0.35 + 0.15 * Math.sin(frame * 0.2));
    const g = ctx.createRadialGradient(-1, -1.6, 0.3, 0, 0, 4.4);
    g.addColorStop(0, '#fff3c4'); g.addColorStop(0.35, '#ffa43a'); g.addColorStop(1, '#a8360a');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, 3.1, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(120, 30, 0, 0.45)';
    dot(1.1, 0.8, 0.45); dot(-0.9, 1.9, 0.35); dot(0.6, -1.9, 0.3);
    if (b.t2 > 70) {
      ctx.strokeStyle = 'rgba(255, 250, 220, 0.9)'; ctx.lineWidth = 0.35;
      ctx.beginPath();
      ctx.moveTo(-2.7, -0.3); ctx.lineTo(-1.4, 0.6); ctx.lineTo(-0.4, -0.4); ctx.lineTo(0.7, 0.7); ctx.lineTo(1.7, -0.2); ctx.lineTo(2.8, 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawAlien(x, y, s = 1) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    glow(0, 0, 11, '#7dff6a', 0.3);
    ctx.strokeStyle = '#7dff6a'; ctx.lineWidth = 0.45; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-1.6, -2.8); ctx.quadraticCurveTo(-2.6, -4.6, -3.4, -5.2);
    ctx.moveTo(1.6, -2.8); ctx.quadraticCurveTo(2.6, -4.6, 3.4, -5.2);
    const sw = Math.sin(frame * 0.15) * 0.6;
    for (const lx of [-3, -1, 1, 3]) { ctx.moveTo(lx * 0.9, 2); ctx.quadraticCurveTo(lx * 1.1 + sw, 3.6, lx * 1.4 - sw, 5); }
    ctx.stroke();
    glow(-3.4, -5.2, 1.8, '#ffd23f');
    glow(3.4, -5.2, 1.8, '#ffd23f');
    const g = ctx.createRadialGradient(-1.2, -1.6, 0.3, 0, 0, 5.5);
    g.addColorStop(0, '#e6ffd8'); g.addColorStop(0.4, '#7dff6a'); g.addColorStop(1, '#1f7a2a');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, -0.2, 4.8, 3.4, 0, 0, TAU); ctx.fill();
    if (frame % 90 < 8) {
      ctx.strokeStyle = '#14320f'; ctx.lineWidth = 0.4;
      ctx.beginPath(); ctx.moveTo(-3, -0.6); ctx.lineTo(-1, -0.4); ctx.moveTo(3, -0.6); ctx.lineTo(1, -0.4); ctx.stroke();
    } else {
      ctx.fillStyle = '#120414';
      for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 2, -0.6, 1.35, 0.9, sx * -0.35, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#ff2a2a'; dot(-1.7, -0.7, 0.35); dot(2.3, -0.7, 0.35);
    }
    ctx.strokeStyle = '#14320f'; ctx.lineWidth = 0.35;
    ctx.beginPath(); ctx.moveTo(-1.2, 1.6); ctx.quadraticCurveTo(0, 2.3, 1.2, 1.6); ctx.stroke();
    ctx.restore();
  }

  function drawMS() {
    const L = ms.x - 64, T = ms.y;
    ctx.save();
    ctx.translate(L, T);
    if (ms.alive) glow(64, 44, 54, '#7b2fd6', 0.32);
    // Armour: the H cells are indestructible, so they render as one smooth saucer
    const fade = ms.alive ? 1 : Math.max(0, 1 - ms.dead / 100);
    if (fade > 0) {
      ctx.globalAlpha = fade;
      const hg = ctx.createLinearGradient(0, 0, 0, 28);
      hg.addColorStop(0, '#c0c8ff'); hg.addColorStop(0.3, '#5a6cf0'); hg.addColorStop(0.75, '#2f3aa8'); hg.addColorStop(1, '#181e68');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.moveTo(0, 28); ctx.lineTo(0, 21.5);
      ctx.quadraticCurveTo(0.5, 18.5, 6, 17.5); ctx.lineTo(22, 14);
      ctx.quadraticCurveTo(33, 12, 37, 6.5); ctx.quadraticCurveTo(43, -0.5, 64, -0.5);
      ctx.quadraticCurveTo(85, -0.5, 91, 6.5); ctx.quadraticCurveTo(95, 12, 106, 14);
      ctx.lineTo(122, 17.5); ctx.quadraticCurveTo(127.5, 18.5, 128, 21.5);
      ctx.lineTo(128, 28); ctx.lineTo(112, 28); ctx.lineTo(112, 24); ctx.lineTo(16, 24); ctx.lineTo(16, 28);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(205, 215, 255, 0.6)'; ctx.lineWidth = 0.4; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.strokeStyle = 'rgba(16, 20, 80, 0.55)'; ctx.lineWidth = 0.3;
      ctx.beginPath();
      ctx.moveTo(3, 21.5); ctx.lineTo(125, 21.5);
      for (const sx of [12, 28, 100, 116]) { ctx.moveTo(sx, sx < 64 ? 17 - sx * 0.08 : 17 - (128 - sx) * 0.08); ctx.lineTo(sx, 24); }
      ctx.stroke();
      // cockpit glass
      const cg = ctx.createRadialGradient(64, 16, 2, 64, 14, 18);
      cg.addColorStop(0, '#2c1656'); cg.addColorStop(1, '#0a0416');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.moveTo(47.5, 24); ctx.lineTo(47.5, 11); ctx.quadraticCurveTo(48, 3.5, 56, 3.5);
      ctx.lineTo(72, 3.5); ctx.quadraticCurveTo(80, 3.5, 80.5, 11); ctx.lineTo(80.5, 24); ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (ms.alive) drawAlien(64, 15);
    if (fade > 0) {
      ctx.globalAlpha = fade;
      ctx.strokeStyle = 'rgba(127, 233, 255, 0.7)'; ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(47.5, 24); ctx.lineTo(47.5, 11); ctx.quadraticCurveTo(48, 3.5, 56, 3.5);
      ctx.lineTo(72, 3.5); ctx.quadraticCurveTo(80, 3.5, 80.5, 11); ctx.lineTo(80.5, 24);
      ctx.stroke();
      ctx.fillStyle = 'rgba(190, 235, 255, 0.16)';
      ctx.beginPath(); ctx.moveTo(50, 20); ctx.lineTo(50, 11); ctx.quadraticCurveTo(50.5, 5.5, 57, 5.5); ctx.lineTo(60, 5.5); ctx.quadraticCurveTo(53, 7, 52.5, 20); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // breakable base: bevelled bricks
    for (let r = 7; r < ms.grid.length; r++) {
      for (let c = 0; c < 32; c++) {
        if (ms.grid[r][c] !== 'B') continue;
        const x = c * 4, y = r * 4;
        ctx.fillStyle = BRICK[r - 7];
        rrect(x + 0.25, y + 0.25, 3.5, 3.5, 0.7); ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 230, 0.4)'; ctx.fillRect(x + 0.8, y + 0.55, 2.4, 0.45);
        ctx.fillStyle = 'rgba(100, 24, 0, 0.35)'; ctx.fillRect(x + 0.7, y + 3.05, 2.6, 0.45);
      }
    }
    // rotating conveyor
    if (ms.alive) { ctx.fillStyle = '#12062a'; ctx.fillRect(16, 24, 96, 4); }
    for (let c = BELT_COL; c < BELT_COL + BELT_N; c++) {
      const i = mod(c - BELT_COL - ms.off, BELT_N);
      if (!ms.belt[i]) continue;
      const x = c * 4;
      ctx.fillStyle = i % 2 ? '#c06bff' : '#9440f0';
      rrect(x + 0.3, 24.4, 3.4, 3.2, 1); ctx.fill();
      ctx.fillStyle = 'rgba(240, 215, 255, 0.55)'; ctx.fillRect(x + 0.9, 24.8, 2.2, 0.4);
    }
    if (ms.alive) {
      const lights = ['#ffd23f', '#7fe9ff', '#ff4f8b', '#8cff5a'];
      [[20, 18.6], [34, 16.4], [94, 16.4], [108, 18.6]].forEach(([lx, ly], i) => {
        const c = lights[(i + (frame >> 3)) % 4];
        ctx.fillStyle = c; dot(lx, ly, 0.7); glow(lx, ly, 3, c, 0.8);
      });
      const on = (frame >> 4) % 2 === 0;
      ctx.fillStyle = on ? '#ff3b4e' : '#5a1020';
      dot(2.5, 26, 0.9); dot(125.5, 26, 0.9);
      if (on) { glow(2.5, 26, 4, '#ff3b4e'); glow(125.5, 26, 4, '#ff3b4e'); }
    }
    ctx.restore();
  }

  function drawPlayer() {
    const p = player;
    if (!p || !p.alive) return;
    ctx.globalAlpha = p.inv > 0 && (frame >> 2) % 2 ? 0.3 : 1;
    drawShip(p.x, p.y);
    ctx.globalAlpha = 1;
    if (p.shieldT > 0 && !(p.shieldT < 20 && frame % 4 < 2)) {
      const cx = p.x, cy = p.y - 1;
      const g = ctx.createRadialGradient(cx, cy, 3, cx, cy, 14);
      g.addColorStop(0, 'rgba(127, 233, 255, 0)'); g.addColorStop(0.7, 'rgba(127, 233, 255, 0.12)'); g.addColorStop(1, 'rgba(210, 250, 255, 0.5)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(cx, cy, 14, 12, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(200, 250, 255, 0.8)'; ctx.lineWidth = 0.45;
      ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.8; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const a0 = frame * 0.12 + i * TAU / 3;
        ctx.beginPath(); ctx.ellipse(cx, cy, 14, 12, 0, a0, a0 + 0.7); ctx.stroke();
      }
      glow(cx, cy, 18, '#7fe9ff', 0.25);
    }
  }

  function drawWorld() {
    const gl = ctx.createLinearGradient(0, 0, W, 0);
    gl.addColorStop(0, 'rgba(120, 60, 180, 0)'); gl.addColorStop(0.5, 'rgba(160, 90, 220, 0.6)'); gl.addColorStop(1, 'rgba(120, 60, 180, 0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 262, W, 0.5);
    if (ms) drawMS();
    for (const b of birds) {
      if (b.kind === 'small') {
        if (b.delay > 0) continue;
        drawSmallBird(b.x, b.y, b.pal, b.anim * (b.state === 'form' ? 0.2 : 0.38) + b.ph, 1,
          b.state === 'form' ? 0 : clamp(b.vx * 0.14, -0.4, 0.4));
      } else if (b.state === 'egg') drawEgg(b);
      else drawBigBird(b, b.x, b.y);
    }
    drawPlayer();
    if (pshot) {
      glow(pshot.x, pshot.y + 3, 4.5, '#ffe65a', 0.8);
      const lg = ctx.createLinearGradient(0, pshot.y, 0, pshot.y + 8);
      lg.addColorStop(0, '#ffffff'); lg.addColorStop(0.4, '#ffe65a'); lg.addColorStop(1, 'rgba(255, 160, 40, 0)');
      ctx.strokeStyle = lg; ctx.lineWidth = 0.9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(pshot.x, pshot.y); ctx.lineTo(pshot.x, pshot.y + 8); ctx.stroke();
    }
    for (const b of ebul) {
      glow(b.x, b.y + 2, 3.4, (frame >> 2) % 2 ? '#ff4f8b' : '#ff7a1a', 0.9);
      ctx.fillStyle = '#ffffff';
      rrect(b.x - 0.45, b.y, 0.9, 4, 0.45); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const r of rings) {
      ctx.globalAlpha = r.life / r.max;
      ctx.strokeStyle = r.c; ctx.lineWidth = 0.4 + r.life / r.max;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    }
    for (const p of parts) {
      ctx.globalAlpha = Math.min(1, (p.life / p.max) * 1.4);
      ctx.strokeStyle = p.c; ctx.lineWidth = p.s * 0.6;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 1.8 + 0.01, p.y - p.vy * 1.8); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    for (const f of floats) txt(f.t, f.x, f.y, f.c, 'center', 8);
  }

  function drawHUD() {
    const blink = mode === 'play' && (frame >> 5) % 2 === 0;
    txt('SCORE', 8, 4, blink ? '#ff4f8b' : '#ff7a1a');
    txt(pad5(score), 8, 14, '#ffffff');
    txt('HI-SCORE', W / 2, 4, '#ff7a1a', 'center');
    txt(pad5(hi), W / 2, 14, '#ffffff', 'center');
    txt('WAVE', W - 8, 4, '#ff7a1a', 'right');
    for (let i = 0; i < 5; i++) {
      const x = W - 46 + i * 8;
      const c = mode === 'attract' ? '#2a1b3d' : i === wave ? '#ffd23f' : i < wave ? '#ff7a1a' : '#2a1b3d';
      ctx.fillStyle = c;
      rrect(x, 15, 6, 6, 1.5); ctx.fill();
      if (mode !== 'attract' && i === wave) glow(x + 3, 18, 6, '#ffd23f', 0.5);
    }
    if (mode !== 'attract') {
      for (let i = 0; i < Math.min(lives - (player && player.alive ? 1 : 0), 6); i++) drawShip(15 + i * 17, 277, 0.8, false);
      const ready = player && player.alive && player.shieldT === 0 && player.shieldCD === 0;
      txt('SHIELD', W - 8, 272, ready ? '#7fe9ff' : player && player.shieldT > 0 ? '#ffffff' : '#3a4a66', 'right');
      ctx.fillStyle = '#1c2236';
      rrect(W - 56, 282, 48, 2, 1); ctx.fill();
      const frac = player ? (player.shieldT > 0 ? player.shieldT / SHIELD_T : 1 - player.shieldCD / SHIELD_CD) : 0;
      if (frac > 0.02) {
        ctx.fillStyle = ready ? '#7fe9ff' : '#3f6c88';
        rrect(W - 56, 282, 48 * frac, 2, 1); ctx.fill();
      }
    }
    if (muted) txt('MUTE', W / 2, 272, '#8f86a8', 'center');
  }

  function drawAttract() {
    const g = ctx.createLinearGradient(0, 40, 0, 62);
    g.addColorStop(0, '#fff2a0'); g.addColorStop(0.45, '#ff8a1a'); g.addColorStop(1, '#ff2a5a');
    ctx.save();
    ctx.shadowColor = 'rgba(255, 100, 30, 0.85)';
    ctx.shadowBlur = 6 * K;
    txt('PHOENIX', W / 2, 40, g, 'center', 22);
    ctx.restore();
    txt('1980 ARCADE TRIBUTE', W / 2, 70, '#8f86a8', 'center');
    txt('SCORE ADVANCE TABLE', W / 2, 98, '#ff4f8b', 'center');
    drawSmallBird(56, 126, 'pink', frame * 0.2);
    txt('20 - 80', 82, 122, '#ffffff');
    drawSmallBird(56, 146, 'blue', frame * 0.2 + 2);
    txt('40 - 80', 82, 142, '#ffffff');
    drawBigBird({ pal: 'fire', flap: frame * 0.12, wings: [[1, 1, 1], [1, 1, 1]] }, 56, 168);
    txt('50 - 800', 82, 164, '#ffffff');
    drawAlien(56, 193, 0.9);
    txt('MYSTERY', 82, 189, ['#ffd23f', '#ff7a1a', '#ff4f8b', '#7fe9ff'][(frame >> 3) % 4]);
    if ((frame >> 5) % 2 === 0) txt(coarseUI ? 'TAP FIRE TO START' : 'PRESS ENTER', W / 2, 222, '#ffd23f', 'center');
    txt('3 SHIPS  BONUS 5000', W / 2, 244, '#8f86a8', 'center');
  }

  function render() {
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    drawBackdrop();
    if (mode === 'attract') {
      drawAttract();
    } else {
      ctx.save();
      if (shake > 0) ctx.translate(rand(-1, 1) * shake * 0.08, rand(-1, 1) * shake * 0.08);
      drawWorld();
      ctx.restore();
      if (mode === 'play' && phase === 'intro') {
        txt('WAVE ' + (cycle * 5 + wave + 1), W / 2, 140, '#ffd23f', 'center', 16);
        txt(WAVE_NAMES[wave], W / 2, 164, '#ff7a1a', 'center');
      }
      if (mode === 'over') {
        txt('GAME OVER', W / 2, 130, '#ff4f8b', 'center', 16);
        if (overT > 60 && (frame >> 5) % 2 === 0) txt(coarseUI ? 'TAP FIRE' : 'PRESS ENTER', W / 2, 158, '#ffd23f', 'center');
      }
      if (paused) {
        ctx.fillStyle = 'rgba(7, 5, 15, 0.6)'; ctx.fillRect(0, 0, W, H);
        txt('PAUSED', W / 2, 132, '#ffffff', 'center', 16);
        txt(coarseUI ? 'TAP TO RESUME' : 'P TO RESUME', W / 2, 156, '#8f86a8', 'center');
      }
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(255, 240, 210, ' + (flash / 60).toFixed(2) + ')'; ctx.fillRect(0, 0, W, H); }
    drawHUD();
  }

  // ---------- loop ----------
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last);
    last = now;
    while (acc >= STEP) {
      if (!paused) update();
      acc -= STEP;
    }
    render();
    if (coarseUI) syncSlideThumb();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
